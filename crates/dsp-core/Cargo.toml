[package]
name = "eqforbeginner-dsp-core"
version = "0.1.5-a"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Deterministic offline DSP core for limited-band multi-position room correction"

[dependencies]
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
