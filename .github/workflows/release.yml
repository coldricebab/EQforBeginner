name: release

# Windows installers cannot be produced on a macOS machine: the Tauri Windows
# bundle needs the MSVC linker, WebView2 and WiX/NSIS, none of which cross-compile.
# This workflow builds each platform on its own runner instead.
#
# Run it from the Actions tab (workflow_dispatch) to get downloadable artifacts,
# or push a `v*` tag to also attach them to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A plain macOS build only runs on the runner's own architecture. The
          # universal target covers Intel Macs too, so one dmg serves everyone.
          - os: macos-latest
            bundles: dmg
            artifact: macos-dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            extra-args: --target universal-apple-darwin
          - os: windows-latest
            bundles: nsis
            artifact: windows-installers
            rust-targets: ""
            extra-args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      # The bundle is only worth building if the code it wraps is sound.
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Test desktop frontend
        run: npm test --prefix apps/desktop

      # Signing is opt-in and driven entirely by repository secrets. With none
      # set these are empty, Tauri falls back to an ad-hoc signature, and the
      # build still succeeds — an unsigned beta rather than a failed one. Adding
      # the macOS secrets turns on Developer ID signing; adding the notarization
      # secrets on top of them also submits the app to Apple.
      - name: Build bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri --prefix apps/desktop -- build --bundles ${{ matrix.bundles }} ${{ matrix.extra-args }}

      # MSI is a bonus, not the deliverable — the NSIS .exe above is what people
      # actually double-click. Windows Installer's ProductVersion is three
      # integers, so a pre-release version such as 0.1.5-a has no representation
      # there. Bundling both in one command would let that failure take the NSIS
      # installer down with it, so MSI gets its own best-effort step. The Rust
      # artifacts are already compiled at this point, so this only re-runs the
      # bundler.
      - name: Build MSI (best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run tauri --prefix apps/desktop -- build --bundles msi

      # State what actually happened rather than letting a download imply more
      # trust than the artifact carries.
      - name: Report macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target -type d -name '*.app' -path '*/release/bundle/*' | head -1)
          if [ -n "$app" ]; then
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
            codesign -d --entitlements - "$app" 2>&1 | grep -c 'audio-input' \
              | xargs -I{} echo "audio-input entitlement present: {}"
          fi

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          # A --target build writes under target/<triple>/release/bundle, a plain
          # one under target/release/bundle. Match both.
          find target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist-bundles/ \;
          ls -la dist-bundles

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-bundles/*
          if-no-files-found: error

      # Attach to the release only when a version tag triggered the run.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-bundles/* --clobber
