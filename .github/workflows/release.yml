name: release

# Windows installers cannot be produced on a macOS machine: the Tauri Windows
# bundle needs the MSVC linker, WebView2 and WiX/NSIS, none of which cross-compile.
# This workflow builds each platform on its own runner instead.
#
# Run it from the Actions tab (workflow_dispatch) to get downloadable artifacts,
# or push a `v*` tag to also attach them to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A plain macOS build only runs on the runner's own architecture. The
          # universal target covers Intel Macs too, so one dmg serves everyone.
          - os: macos-latest
            bundles: dmg
            artifact: macos-dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            extra-args: --target universal-apple-darwin
          - os: windows-latest
            bundles: msi,nsis
            artifact: windows-installers
            rust-targets: ""
            extra-args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      # The bundle is only worth building if the code it wraps is sound.
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Test desktop frontend
        run: npm test --prefix apps/desktop

      - name: Build bundles
        run: npm run tauri --prefix apps/desktop -- build --bundles ${{ matrix.bundles }} ${{ matrix.extra-args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          # A --target build writes under target/<triple>/release/bundle, a plain
          # one under target/release/bundle. Match both.
          find target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist-bundles/ \;
          ls -la dist-bundles

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-bundles/*
          if-no-files-found: error

      # Attach to the release only when a version tag triggered the run.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-bundles/* --clobber
